name: Build and Release Android APK

on:
  push:
    branches: [ main ]
    tags:
      - 'v*'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    name: Build Android APK
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: Setup Android SDK
        uses: android-actions/setup-android@v3

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.11.1'

      - name: Setup environment secrets
        run: |
          if [ ! -f .env ]; then
            cp .env.example .env
          fi

      - name: Grant execute permission for gradlew
        run: chmod +x gradlew || true

      - name: Build Debug APK
        run: gradle assembleDebug --stacktrace

      - name: Verify APK Generated
        run: |
          ls -la app/build/outputs/apk/debug/
          cp app/build/outputs/apk/debug/app-debug.apk app/build/outputs/apk/debug/Tigers-Widget.apk

      - name: Upload APK as Workflow Artifact
        uses: actions/upload-artifact@v4
        with:
          name: Tigers-Widget-APK
          path: app/build/outputs/apk/debug/Tigers-Widget.apk
          if-no-files-found: error

      - name: Create or Update GitHub Release
        uses: softprops/action-gh-release@v2
        if: startsWith(github.ref, 'refs/tags/') || github.ref == 'refs/heads/main'
        with:
          tag_name: latest
          name: Detroit Tigers Widget APK (Latest Build)
          body: |
            ## ⚾ Detroit Tigers Android App & Home Screen Widget
            
            This release contains the latest automated `.apk` build for direct installation on Android devices.
            
            ### 📥 Download & Installation:
            1. Download `Tigers-Widget.apk` below directly to your Android device.
            2. Open the file on your device to install (enable *Install from Unknown Sources* if prompted).
            3. Long-press on your home screen to add the **Tigers Countdown Widget**!
          draft: false
          prerelease: false
          files: app/build/outputs/apk/debug/Tigers-Widget.apk
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
