name: Build and Release Android APK

on:
  push:
    branches: [ main ]
    tags:
      - 'v*'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    name: Build Android APK
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: Setup Android SDK
        uses: android-actions/setup-android@v3

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v4

      - name: Setup environment secrets
        env:
          ENV_GEMINI_KEY: ${{ secrets.GEMINI_API_KEY }}
          ENV_GOOGLE_KEY: ${{ secrets.GOOGLE_API_KEY }}
        run: |
          if [ ! -f .env ]; then
            cp .env.example .env
          fi
          if [ -n "$ENV_GEMINI_KEY" ]; then
            sed -i "s/^GEMINI_API_KEY=.*/GEMINI_API_KEY=$ENV_GEMINI_KEY/" .env
          fi
          if [ -n "$ENV_GOOGLE_KEY" ]; then
            sed -i "s/^GOOGLE_API_KEY=.*/GOOGLE_API_KEY=$ENV_GOOGLE_KEY/" .env
          fi

      - name: Grant execute permission for gradlew
        run: chmod +x gradlew

      - name: Build Debug APK
        run: ./gradlew assembleDebug --stacktrace

      - name: Extract Version & Package Versioned APK
        id: version_step
        run: |
          VERSION=$(grep "VERSION_MAJOR" version.properties | cut -d'=' -f2).$(grep "VERSION_MINOR" version.properties | cut -d'=' -f2).$(grep "VERSION_PATCH" version.properties | cut -d'=' -f2)
          BUILD=$(grep "VERSION_BUILD" version.properties | cut -d'=' -f2)
          if [ "$BUILD" -gt "0" ]; then
            FULL_VERSION="${VERSION}.${BUILD}"
          else
            FULL_VERSION="${VERSION}"
          fi
          echo "APP_VERSION=${FULL_VERSION}" >> $GITHUB_OUTPUT
          echo "Building for version: ${FULL_VERSION}"
          
          ls -la app/build/outputs/apk/debug/
          cp app/build/outputs/apk/debug/app-debug.apk app/build/outputs/apk/debug/Tigers-Widget-v${FULL_VERSION}.apk
          cp app/build/outputs/apk/debug/app-debug.apk app/build/outputs/apk/debug/Tigers-Widget.apk

      - name: Upload APK as Workflow Artifact
        uses: actions/upload-artifact@v4
        with:
          name: Tigers-Widget-v${{ steps.version_step.outputs.APP_VERSION }}-APK
          path: |
            app/build/outputs/apk/debug/Tigers-Widget-v${{ steps.version_step.outputs.APP_VERSION }}.apk
            app/build/outputs/apk/debug/Tigers-Widget.apk
          if-no-files-found: error

      - name: Create or Update GitHub Release
        uses: softprops/action-gh-release@v2
        if: startsWith(github.ref, 'refs/tags/') || github.ref == 'refs/heads/main'
        with:
          tag_name: v${{ steps.version_step.outputs.APP_VERSION }}
          name: Detroit Tigers Widget v${{ steps.version_step.outputs.APP_VERSION }}
          body: |
            ## ⚾ Detroit Tigers Android App & Home Screen Widget (v${{ steps.version_step.outputs.APP_VERSION }})
            
            This release contains the latest automated `.apk` build for direct installation on Android devices.
            
            ### 📥 Download & Installation:
            1. Download `Tigers-Widget-v${{ steps.version_step.outputs.APP_VERSION }}.apk` (or `Tigers-Widget.apk`) below directly to your Android device.
            2. Open the file on your device to install (enable *Install from Unknown Sources* if prompted).
            3. Long-press on your home screen to add the **Tigers Countdown Widget**!
          draft: false
          prerelease: false
          files: |
            app/build/outputs/apk/debug/Tigers-Widget-v${{ steps.version_step.outputs.APP_VERSION }}.apk
            app/build/outputs/apk/debug/Tigers-Widget.apk
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
